<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>World Rich List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#12163A;      /* night sky */
  --panel:#1B2052;    /* surfaces */
  --panel2:#252B6B;   /* raised surfaces */
  --line:#2E3578;     /* dividers */
  --chalk:#F2F0FF;    /* primary text */
  --mist:#9AA0D6;     /* secondary text */
  --gold:#FFC53D;     /* Stars */
  --you:#62E0B4;      /* "yours" */
  --bad:#FF6B8A;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ink);color:var(--chalk);
  font:500 15px/1.4 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--display);font-weight:700;letter-spacing:-.01em}

/* ---------- layout ---------- */
#app{min-height:100vh;padding:0 16px calc(110px + var(--safe-b));background:radial-gradient(120% 40% at 50% -6%,rgba(255,197,61,.13),transparent 60%)}
header{padding:18px 0 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.2}
.sub{color:var(--mist);font-size:13px;margin-top:4px;max-width:24ch}
.seg{display:inline-flex;background:var(--panel);border-radius:12px;padding:3px;flex:none}
.seg button{padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mist);min-height:36px}
.seg.lang button{padding:6px 8px;min-height:30px;font-size:12px}
header .seg.lang{margin-top:2px}
.seg button[aria-pressed="true"]{background:var(--panel2);color:var(--chalk)}

/* ---------- flags ---------- */
.flag{display:inline-block;width:30px;height:20px;border-radius:4px;object-fit:cover;vertical-align:middle;
  background:var(--panel2);box-shadow:0 0 0 1px rgba(255,255,255,.08);flex:none}
.flag.lg{width:54px;height:36px;border-radius:6px}
.flag-emoji{display:inline-block;width:30px;text-align:center;font-size:18px;line-height:20px}
.flag-emoji.lg{width:54px;font-size:30px;line-height:36px}

/* ---------- podium ---------- */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin:6px 0 20px}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pod .who{margin-top:8px;font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .amt{font-size:12px;color:var(--mist);margin:1px 0 8px}
.pod .amt b{color:var(--gold);font-family:var(--display);font-weight:700}
.bar{width:100%;border-radius:12px 12px 4px 4px;background:var(--panel2);display:flex;align-items:flex-start;justify-content:center;
  padding-top:10px;transform-origin:bottom}
.bar .num{font-size:26px;color:var(--mist)}
.pod.first .bar{background:linear-gradient(180deg,#FFD870,var(--gold));box-shadow:0 0 36px rgba(255,197,61,.35)}
.pod.first .bar .num{color:var(--ink);font-size:34px}
.pod.mine .who{color:var(--you)}
.pod.open .flag-slot{width:54px;height:36px;border:2px dashed var(--line);border-radius:6px}
.pod.open .who{color:var(--mist);font-weight:500}
.entered .bar{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.entered .pod.first .bar{animation-delay:.05s}
.entered .pod:nth-child(1) .bar{animation-delay:.18s}
.entered .pod:nth-child(3) .bar{animation-delay:.3s}
@keyframes rise{from{transform:scaleY(.05)}to{transform:scaleY(1)}}

/* ---------- strips & rows ---------- */
.strip{border:1.5px solid var(--you);border-radius:16px;padding:14px;margin-bottom:18px;display:flex;align-items:center;gap:12px}
.strip .t{font-weight:700}
.strip .d{color:var(--mist);font-size:13px;margin-top:2px}
.strip .flag{width:40px;height:27px}
.strip.cta{border-style:dashed;border-color:var(--line)}
.list{display:flex;flex-direction:column}
.row{position:relative;display:grid;grid-template-columns:28px 36px 1fr auto;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .pos{font-family:var(--display);font-weight:500;font-size:13px;color:var(--mist);text-align:center}
.row .name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--mist);font-weight:500}
.row .stars{font-family:var(--display);font-weight:700;font-size:14px;color:var(--gold);text-align:right;white-space:nowrap}
.row .fill{grid-column:2/-1;height:4px;border-radius:2px;background:var(--panel);overflow:hidden;margin-top:-2px}
.row .fill i{display:block;height:100%;background:var(--line);border-radius:2px}
.row.mine .name{color:var(--you)}
.row.mine .fill i{background:var(--you)}
.row.sample{opacity:.75}
.row.sample .pos{font-size:16px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--mist);border:1px dashed var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.empty{padding:28px 8px;text-align:center;color:var(--mist)}
.empty b{display:block;color:var(--chalk);font-size:16px;margin-bottom:4px}

/* ---------- me ---------- */
.card{background:var(--panel);border-radius:18px;padding:16px;margin-bottom:12px}
.hello{display:flex;align-items:center;gap:12px}
.hello .avatar{width:48px;height:48px;font-size:18px}
.hello .t{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2}
.hello .d{color:var(--mist);font-size:13px;margin-top:2px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.trio div{background:var(--ink);border-radius:12px;padding:12px 8px;text-align:center}
.trio .num{display:block;font-size:20px}
.trio span.l{display:block;font-size:11.5px;color:var(--mist);margin-top:2px}
.trio .gold{color:var(--gold)}
h2{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:6px}
.card p{color:var(--mist);font-size:13.5px}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;min-height:46px;border-radius:12px;background:var(--panel2);font-weight:700;padding:0 14px}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.5}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting small{display:block;color:var(--mist);font-size:12.5px;font-weight:500;margin-top:1px}
.switch{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--chalk);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--you)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--ink)}
ol.how{list-style:none;counter-reset:s;margin-top:4px}
ol.how li{counter-increment:s;display:flex;gap:12px;padding:8px 0;color:var(--chalk);font-size:14px}
ol.how li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--panel2);
  display:grid;place-items:center;font-family:var(--display);font-size:12px;color:var(--gold)}

/* ---------- bottom bars ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--ink) 55%,rgba(18,22,58,0));padding:26px 14px calc(8px + var(--safe-b));z-index:5}
.donate{width:100%;min-height:54px;border-radius:16px;background:var(--gold);color:var(--ink);font-weight:700;font-size:16px;
  display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.donate .flag{width:26px;height:17px}
.tabs{display:grid;grid-template-columns:1fr 1fr 78px 1fr;align-items:end;background:rgba(27,32,82,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:5px 6px;box-shadow:0 10px 30px rgba(4,6,24,.55)}
.tabs button:not(.fab){display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:14px;color:var(--mist);font-size:12px;font-weight:600;min-height:52px}
.tabs button:not(.fab) svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button:not(.fab)[aria-selected="true"]{color:var(--gold);background:rgba(37,43,107,.9)}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(6,8,28,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--panel);border-radius:24px 24px 0 0;
  padding:10px 16px calc(18px + var(--safe-b));max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:18px;margin-bottom:4px}
.sheet .lead{color:var(--mist);font-size:13.5px;margin-bottom:14px}
.search{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--ink);color:var(--chalk);padding:0 14px;font:inherit;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--panel2);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.picklist{max-height:42vh;overflow:auto;margin:6px -4px 0}
.pick{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 4px;text-align:left;border-radius:10px;font-weight:600}
.pick:active{background:var(--panel2)}
.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.amounts button{min-height:54px;border-radius:14px;background:var(--panel2);font-family:var(--display);font-weight:700;font-size:16px}
.amounts button[aria-pressed="true"]{background:var(--gold);color:var(--ink)}
.amounts button:last-child:nth-child(3n+2){grid-column:span 2}
.custom{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.custom input{flex:1}
.custom .search{margin:0}
.done{text-align:center;padding:12px 0 6px}
.done .big{font-size:44px;margin-bottom:6px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:4px 0}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--panel2);color:var(--chalk);padding:12px 16px;border-radius:12px;
  z-index:30;max-width:90vw;font-weight:600;font-size:14px;transition:transform .25s;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast.show{transform:translate(-50%,0)}
.gate{min-height:80vh;display:grid;place-items:center;text-align:center;color:var(--mist);padding:24px}
.gate b{display:block;color:var(--chalk);font-family:var(--display);font-size:20px;margin-bottom:8px}
.skel{height:64px;border-radius:14px;background:var(--panel);margin-bottom:10px;opacity:.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- toolbar, ranks ---------- */
.tools{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.tools .seg button{padding:8px 11px}
.tools.scope{justify-content:flex-start}
.ranks{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:10px}
.ranks th{font-size:12px;font-weight:600;color:var(--mist);text-align:center;padding-bottom:2px}
.ranks th:first-child,.ranks td:first-child{text-align:left}
.ranks td{padding:0}
.ranks .lab{font-weight:600;font-size:14px;padding:12px 0}
.ranks .lab small{display:block;color:var(--mist);font-size:11.5px;font-weight:500}
.cell{display:block;width:100%;min-height:46px;border-radius:12px;background:var(--ink);font-family:var(--display);font-weight:700;font-size:15px}
.cell.none{color:var(--line);font-family:inherit;font-weight:600;font-size:12.5px;color:var(--mist)}
.cell.top{background:var(--gold);color:var(--ink)}
.cell.ok{color:var(--you)}
.cell + .cell{margin-left:6px}
.ranks td+td{padding-left:6px}
.pin{display:inline-grid;place-items:center;width:30px;height:20px;font-size:15px}
.loc{display:flex;align-items:center;gap:8px}

.fab{position:relative;top:-18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-top:2px;width:64px;height:64px;margin:0 auto;border-radius:50%;
  background:linear-gradient(160deg,#FFD870,var(--gold) 55%,#F0A91E);color:var(--ink);box-shadow:0 8px 22px rgba(255,197,61,.45),0 0 0 5px var(--ink)}
.fab span{font-size:22px;line-height:1;margin-bottom:1px}.fab em{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.01em}
.fab:active{transform:scale(.95)}
.row.mine{background:linear-gradient(90deg,rgba(98,224,180,.12),transparent);border-radius:12px;margin:0 -8px;padding-left:8px;padding-right:8px}
.battle{background:linear-gradient(135deg,#2A2F7E,#1B2052 70%);border:1px solid var(--line);border-radius:20px;padding:14px 14px 12px;margin-bottom:16px}
.battle .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.battle h2{margin:0;font-size:15px}
.timer{font-size:12px;font-weight:700;color:var(--ink);background:var(--gold);border-radius:999px;padding:4px 10px}
.battle .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.battle .mini>div{background:rgba(18,22,58,.6);border-radius:12px;padding:10px 6px;text-align:center;min-width:0}
.battle .mini .n{font-size:12px;font-weight:700;margin-top:4px;line-height:1.25;min-height:30px}
.battle .mini .v{font-size:11.5px;color:var(--gold);font-weight:700}
.battle .last{margin-top:10px;font-size:12.5px;color:var(--mist)}
.battle .last b{color:var(--chalk)}
.challenge{margin-top:8px;width:100%;min-height:42px;border-radius:12px;background:rgba(255,197,61,.14);color:var(--gold);font-weight:700;font-size:13.5px}
.live{margin-top:22px}
.live h2{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--you);box-shadow:0 0 0 0 rgba(98,224,180,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(98,224,180,0)}100%{box-shadow:0 0 0 0 rgba(98,224,180,0)}}
.ev{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.ev:first-of-type{border-top:0}.ev .t{color:var(--mist);font-size:12px;margin-left:auto;white-space:nowrap}
.ev b{color:var(--gold)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.badge{background:var(--ink);border-radius:14px;padding:12px 6px 10px;text-align:center}
.badge i{display:block;font-style:normal;font-size:26px;line-height:1.1}
.badge span{display:block;font-size:11.5px;font-weight:700;margin-top:4px}
.badge small{display:block;font-size:10.5px;color:var(--mist);margin-top:1px}
.badge.off{opacity:.38;filter:grayscale(1)}
.badge.on{box-shadow:inset 0 0 0 1.5px rgba(255,197,61,.55)}
.trial{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin-bottom:10px;padding:0 14px;border-radius:14px;border:1.5px dashed var(--gold);color:var(--gold);font-weight:700;text-align:left}
.trial small{display:block;color:var(--mist);font-weight:500;font-size:12px}
.trial[aria-pressed="true"]{background:var(--gold);color:var(--ink)}.trial[aria-pressed="true"] small{color:var(--ink)}
.dots{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold);width:22px;border-radius:4px}
.intro{text-align:center;padding:6px 0}.intro .big{font-size:52px;margin-bottom:6px}.intro .trust{font-size:12px;color:var(--mist);margin-top:10px}
.confetti{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
</style>
</head>
<body>
<div id="app"></div>
<div class="dock" id="dock" hidden>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="p" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3z"/></svg><span data-i18n="Places">Places</span></button>
    <button role="tab" data-tab="pe" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5M16 5.2a3 3 0 010 5.6M18 14.8c1.8.7 3 2.3 3 4.7"/></svg><span data-i18n="People">People</span></button>
    <button class="fab" id="donateBtn" data-act="open-donate" aria-label="Donate Stars"><span>⭐</span><em data-i18n="Donate">Donate</em></button>
    <button role="tab" data-tab="me" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.6-3.6 3.5-5.6 7.5-5.6s6.9 2 7.5 5.6"/></svg><span data-i18n="Me">Me</span></button>
  </nav>
</div>
<div class="backdrop" id="backdrop" data-act="close-sheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const INIT = tg ? tg.initData : "";
const DEMO = !INIT && new URLSearchParams(location.search).has("demo");
const POPULAR = ["UZ","KZ","KG","TJ","TM","RU","TR","UA","AZ","US","IN","BR"];

const S = {
  me: null, cfg: null, countries: [], byCode: {}, regions: {}, regName: {},
  tab: "p", metric: "stars", period: "all", level: "countries", scope: "world",
  board: null, pulse: null, loading: false, entered: false, regionAsked: false,
  introSlide: 0, counted: false,
  sheet: { open: false, step: "amount", after: "amount", amount: 50, custom: "", search: "", busy: false, error: "", paid: 0 },
};

/* ---------------- helpers ---------------- */
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = (n) => Number(n).toLocaleString("en-US").replace(/,/g, " ");
const okCode = (c) => /^[A-Z]{2}$/.test(c || "");
const cname = (c) => (S.byCode[c] || c || "");
const rname = (k) => (S.regName[k] || k || "");
const unit = () => (S.metric === "stars" ? "⭐" : "👥");
const val = (v) => `${fmt(v)} ${unit()}`;
const hasRegions = (cc) => !!(cc && S.regions[cc] && S.regions[cc].length);
const emojiFlag = (c) => String.fromCodePoint(...[...c].map((ch) => 0x1F1E6 + ch.charCodeAt(0) - 65));
function flag(code, big) {
  if (!okCode(code)) return `<span class="flag-slot"></span>`;
  const cls = big ? "flag lg" : "flag";
  return `<img class="${cls}" alt="" loading="lazy" data-emoji="${emojiFlag(code)}" src="https://flagcdn.com/w80/${code.toLowerCase()}.png">`;
}
document.addEventListener("error", (e) => {
  const el = e.target;
  if (el && el.tagName === "IMG" && el.classList.contains("flag")) {
    const s = document.createElement("span");
    s.className = "flag-emoji" + (el.classList.contains("lg") ? " lg" : "");
    s.textContent = el.dataset.emoji || "🏳️";
    el.replaceWith(s);
  }
}, true);
const hue = (s) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };

const LANGS = [["en", "EN"], ["uz", "UZ"], ["ru", "RU"]];
let LANG = "en";
function detectLang() {
  try { const saved = localStorage.getItem("wrl_lang"); if (saved && DICT[saved] || saved === "en") return saved; } catch (_) {}
  const c = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || "en").slice(0, 2).toLowerCase();
  return c === "uz" ? "uz" : (["ru", "be", "kk", "ky", "tg"].includes(c) ? "ru" : "en");
}
function t(key, vars) {
  let out = (DICT[LANG] && DICT[LANG][key]) || key;
  if (vars) for (const k in vars) out = out.split("{" + k + "}").join(vars[k]);
  return out;
}
const gapText = (n, x) => S.metric === "stars" ? t("{n} ⭐ more to pass {x}", { n: fmt(n), x }) : t("{n} more friends to pass {x}", { n: fmt(n), x });
const langHTML = () => `<div class="seg lang" role="group" aria-label="Language">${LANGS.map(([c, l]) => `<button data-act="lang" data-v="${c}" aria-pressed="${LANG === c}">${l}</button>`).join("")}</div>`;
function setLang(l) {
  LANG = l; try { localStorage.setItem("wrl_lang", l); } catch (_) {}
  document.documentElement.lang = l; applyStatic(); render();
}
function applyStatic() {
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  const f = $("#donateBtn"); if (f) f.setAttribute("aria-label", t("Donate"));
}

/* ---------------- API ---------------- */
async function api(path, opts = {}) {
  if (DEMO) return demoApi(path, opts);
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: { "X-Tg-Init-Data": INIT, "Content-Type": "application/json" },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(data.error || "Request failed. Please try again.");
  return data;
}

/* ---------------- data loading ---------------- */
function boardQuery() {
  const m = `metric=${S.metric}&period=${S.period}`;
  if (S.tab === "p") return `kind=places&scope=${S.level}&${m}`;
  return `kind=people&scope=${S.scope}&${m}`;
}
async function loadBoard() {
  S.loading = true; render();
  try {
    const [b, p] = await Promise.all([api(`/api/board?${boardQuery()}`), S.tab === "p" ? api("/api/pulse").catch(() => null) : Promise.resolve(S.pulse)]);
    S.board = b; if (p) S.pulse = p;
  } catch (e) { toast(e.message); }
  S.loading = false; render();
}
async function refreshAll() {
  try {
    const before = S.me && S.me.pos, b = await api("/api/bootstrap"); S.me = b.me;
    if (before && b.me.pos && b.me.pos < before) { toast(`#${before} → #${b.me.pos} 🎉`); confetti(); }
    if (S.tab !== "me") await loadBoard(); else render();
  } catch (e) { toast(e.message); }
}
function normalizeScopes() {
  const cc = S.me.country;
  if (S.level === "regions" && !hasRegions(cc)) S.level = "countries";
  if (S.scope === "region" && !(hasRegions(cc) && S.me.region)) S.scope = (S.scope === "region" && cc) ? "country" : "world";
  if (S.scope === "country" && !cc) S.scope = "world";
}

/* ---------------- shared row pieces ---------------- */
function podiumHTML(items) {
  const lead = items.length ? items[0].value : 0;
  const order = [1, 0, 2];
  const cell = (i) => {
    const r = items[i], first = i === 0;
    const h = r ? Math.max(44, Math.round(132 * (r.value / (lead || 1)))) : 44;
    if (!r) return `<div class="pod open"><div class="flag-slot"></div><div class="who">${t("Open spot")}</div><div class="amt">&nbsp;</div><div class="bar" style="height:${h}px"><span class="num">${i + 1}</span></div></div>`;
    return `<div class="pod ${first ? "first" : ""} ${r.mine ? "mine" : ""}">${r.big}<div class="who">${esc(r.name)}</div><div class="amt"><b>${fmt(r.value)}</b> ${unit()}</div><div class="bar" style="height:${h}px"><span class="num">${i + 1}</span></div></div>`;
  };
  return `<div class="podium ${S.entered ? "" : "entered"}">${order.map(cell).join("")}</div>`;
}
const ctaStrip = (title, text, act, label) =>
  `<div class="strip cta"><div style="flex:1"><div class="t">${title}</div><div class="d">${text}</div></div><button class="btn gold" style="flex:none;min-height:40px" data-act="${act}">${label}</button></div>`;
const shareText = () => S.me.region
  ? `Help ${rname(S.me.region)} climb the ranking! ⭐`
  : (S.me.country ? `Help ${cname(S.me.country)} reach #1 on the Country Ranking! ⭐` : "Which country is the richest in Telegram Stars?");
const SKEL = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;


/* ---------------- battle, feed, badges, challenge ---------------- */
const placeLabel = (k) => (okCode(k) ? cname(k) : rname(k));
const placeFlag = (k) => flag(okCode(k) ? k : (k || "").split("-")[0]);
function left(sec) {
  const d = Math.floor(sec / 86400), h = Math.floor((sec % 86400) / 3600), m = Math.floor((sec % 3600) / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${Math.max(1, m)}m`;
}
function ago(sec) {
  if (sec < 90) return t("now"); if (sec < 3600) return `${Math.round(sec / 60)}m`;
  if (sec < 86400) return `${Math.round(sec / 3600)}h`; return `${Math.round(sec / 86400)}d`;
}
function battleHTML() {
  const p = S.pulse; if (!p) return "";
  const b = p.battle, slots = [0, 1, 2].map((i) => b.now[i]);
  const cell = (r, i) => r
    ? `<div>${placeFlag(r.key)}<div class="n">${["🥇","🥈","🥉"][i]} ${esc(placeLabel(r.key))}</div><div class="v">${fmt(r.value)} ⭐</div></div>`
    : `<div><div class="flag-slot" style="width:30px;height:20px;border:2px dashed var(--line);border-radius:4px;margin:0 auto"></div><div class="n" style="color:var(--mist)">${t("Open")}</div><div class="v">&nbsp;</div></div>`;
  const last = b.last[0]
    ? `${t("Last week's winner:")} <b>${placeFlag(b.last[0].key)} ${esc(placeLabel(b.last[0].key))}</b>${b.last_regions[0] ? ` · ${t("region")} <b>${esc(rname(b.last_regions[0].key))}</b>` : ""}`
    : t("Last week: no winner yet. Be the first.");
  return `<div class="battle"><div class="top"><h2>⚔️ ${t("Weekly battle")}</h2><span class="timer">${t("ends in {x}", { x: left(b.resets_in) })}</span></div>
    <div class="mini">${slots.map(cell).join("")}</div><div class="last">${last}</div></div>`;
}
function feedHTML() {
  const p = S.pulse; if (!p || !p.feed.length) return "";
  return `<div class="live"><h2><span class="dot"></span>${t("Live")}</h2>${p.feed.map((e) => {
    const where = e.region ? rname(e.region) : (e.code ? cname(e.code) : "");
    return `<div class="ev">${e.code ? flag(e.code) : ""}<div>${t("{n} sent {a} ⭐ for {w}", { n: "<b>" + esc(e.name) + (e.is_me ? " (" + t("you") + ")" : "") + "</b>", a: fmt(e.amount), w: esc(where || "…") })}</div><span class="t">${ago(e.ago)}</span></div>`;
  }).join("")}</div>`;
}
function badgesHTML() {
  const m = S.me, rk = m.ranks || {}, top = (r, n) => !!(r && r.pos <= n);
  const list = [
    ["⭐", t("First Star"), t("Donate once"), m.total > 0],
    ["🏅", t("Founding Donor"), t("One of the first 50"), !!(m.donor_no && m.donor_no <= 50)],
    ["📍", t("Region #1"), t("Lead your region"), top(rk.stars_region, 1) || top(rk.friends_region, 1)],
    ["🚩", t("Country #1"), t("Lead your country"), top(rk.stars_country, 1) || top(rk.friends_country, 1)],
    ["🌍", t("World top 10"), t("Reach the world top"), top(rk.stars_world, 10) || top(rk.friends_world, 10)],
    ["🤝", t("Connector"), t("Invite 3 friends"), m.invited >= 3],
    ["🐋", t("Big Fish"), t("Donate 500 ⭐"), m.total >= 500],
    ["🔥", t("Rally"), t("Invite 10 friends"), m.invited >= 10],
    ["🕶", t("Low profile"), t("Hide your name"), !!m.anon],
  ];
  const got = list.filter((b) => b[3]).length;
  return `<div class="card"><h2>${t("Badges")} · ${got}/${list.length}</h2><p>${t("Earned from real activity. No donation needed for most of them.")}</p>
    <div class="badges">${list.map(([i, n, d, on]) => `<div class="badge ${on ? "on" : "off"}"><i>${i}</i><span>${n}</span><small>${d}</small></div>`).join("")}</div></div>`;
}
function challengeText(rival, gap, myName) {
  return t("{me} is only {n} {u} behind {r} on the World Rich List! Join the race, it's free to look and pick a side.", { me: myName, n: fmt(gap), u: S.metric === "stars" ? "⭐" : t("friends"), r: rival });
}

/* ---------------- Places tab ---------------- */
function placesHTML() {
  const b = S.board;
  if (!b || b.kind !== "places") return SKEL;
  const regions = b.scope === "regions", cc = S.me.country;
  const items = b.rows.map((r) => ({
    value: r.value, members: r.members, key: r.key,
    name: regions ? rname(r.key) : cname(r.key),
    mine: regions ? r.key === S.me.region : r.key === cc,
    big: flag(regions ? b.country : r.key, true),
    small: flag(regions ? b.country : r.key),
  }));
  const lead = items.length ? items[0].value : 0;
  const who = S.metric === "stars" ? "{n} donor" : "{n} inviter";
  let strip = "";
  if (!cc) strip = ctaStrip(t("Pick your country"), t("Your Stars and friends will count for it."), "open-donate", t("Choose"));
  else if (regions && !S.me.region) strip = ctaStrip(t("Pick your region"), t("Join the {c} regional race.", { c: esc(cname(cc)) }), "set-region", t("Choose"));
  else {
    const myKey = regions ? S.me.region : cc, mine = b.mine;
    const nm = regions ? rname(myKey) : cname(myKey);
    let line;
    if (!mine) line = S.metric === "stars" ? t("No Stars yet. Be the first for {x}.", { x: esc(nm) }) : t("No friends yet. Invite someone from {x}.", { x: esc(nm) });
    else if (mine.pos === 1) line = t("You lead the ranking. Keep your lead.");
    else {
      const above = items[mine.pos - 2];
      line = above ? gapText(above.value - mine.value + 1, esc(above.name)) : t("Keep going to climb.");
    }
    const above2 = mine && mine.pos > 1 ? items[mine.pos - 2] : null;
    const ch = above2 ? `<button class="challenge" data-act="challenge" data-text="${esc(challengeText(above2.name, above2.value - mine.value + 1, nm))}">⚔️ ${t("Challenge friends to pass {x}", { x: esc(above2.name) })}</button>` : `<button class="challenge" data-act="challenge" data-text="${esc(t("{x} leads the World Rich List! Come and join the race.", { x: nm }))}">📣 ${t("Share {x}'s lead", { x: esc(nm) })}</button>`;
    strip = `<div class="strip" style="flex-wrap:wrap">${flag(cc)}<div><div class="t">${esc(nm)} · ${mine ? `#${mine.pos} · ${val(mine.value)}` : t("Not ranked yet")}</div><div class="d">${line}</div></div>${ch}</div>`;
    if (!mine) strip = strip.replace(/<button class="challenge"[\s\S]*?<\/button>/, `<button class="challenge" data-act="challenge" data-text="${esc(t("Help {x} get on the World Rich List!", { x: nm }))}">📣 ${t("Invite friends for {x}", { x: esc(nm) })}</button>`);
  }
  let html = (b.scope === "countries" && S.period === "all" ? battleHTML() : "") + podiumHTML(items) + strip;
  const sample = !regions && S.metric === "stars" && S.period === "all" && S.cfg.sample.show && lead < S.cfg.sample.stars
    ? `<div class="row sample"><div class="pos">🎯</div><div class="avatar" style="background:var(--panel2)">🤖</div><div><div class="name">${t("Demo country")}<span class="tag">${t("sample")}</span></div><div class="meta">${t("Not a real country. Beat it to take #1.")}</div></div><div class="stars">${fmt(S.cfg.sample.stars)} ⭐</div></div>` : "";
  if (!items.length) {
    html += `<div class="list">${sample}</div><div class="empty"><b>${S.metric === "stars" ? t("No Stars donated yet") : t("No friends invited yet")}</b>${S.metric === "stars" ? t("Be the first. Donate for your place.") : t("Share your link. Friends who pick a country count.")}</div>`;
  } else {
    html += `<div class="list">${sample}${items.slice(3).map((r, i) => {
      const w = Math.max(3, Math.round(100 * r.value / (lead || 1)));
      return `<div class="row ${r.mine ? "mine" : ""}"><div class="pos">${i + 4}</div>${r.small}<div><div class="name">${esc(r.name)}</div><div class="meta">${t(who + (r.members === 1 ? "" : "s"), { n: r.members })}</div></div><div class="stars">${val(r.value)}</div><div class="fill"><i style="width:${w}%"></i></div></div>`;
    }).join("")}</div>`;
    if (items.length <= 3) html += `<div class="empty"><b>${t("The race is just starting")}</b>${t("Take a spot on the podium.")}</div>`;
  }
  return html + (b.scope === "countries" ? feedHTML() : "");
}

/* ---------------- People tab ---------------- */
function peopleHTML() {
  const b = S.board;
  if (!b || b.kind !== "people") return SKEL;
  const scopeName = { world: t("the world"), country: cname(S.me.country), region: rname(S.me.region) }[b.scope];
  const rows = b.rows, mine = b.mine;
  let strip;
  if (mine) {
    const above = rows[mine.pos - 2];
    const line = mine.pos === 1 ? t("You lead this list.") : (above ? gapText(above.value - mine.value + 1, esc(above.name)) : t("Keep going to climb."));
    strip = `<div class="strip"><div><div class="t">${t("You · #{p} in {s} · {v}", { p: mine.pos, s: esc(scopeName), v: val(mine.value) })}</div><div class="d">${line}</div></div></div>`;
  } else if (S.metric === "stars") {
    strip = ctaStrip(t("You're not on this list yet"), t("Donate once to appear in {s}.", { s: esc(scopeName) }), "open-donate", t("Donate"));
  } else {
    strip = ctaStrip(t("You're not on this list yet"), t("Invite a friend who picks a country to appear in {s}.", { s: esc(scopeName) }), "share", t("Invite"));
  }
  let html = strip;
  if (!rows.length) {
    html += `<div class="empty"><b>${t("Nobody here yet")}</b>${S.metric === "stars" ? t("Be the first donor on this list.") : t("Be the first to invite a friend.")}</div>`;
    return html;
  }
  const lead = rows[0].value;
  html += `<div class="list">${rows.map((r) => {
    const w = Math.max(3, Math.round(100 * r.value / (lead || 1)));
    const you = r.is_me ? `<span class="tag">${t("you")}${r.anon ? ", " + t("hidden") : ""}</span>` : "";
    const where = (r.region ? esc(rname(r.region)) + ", " : "") + (r.code ? esc(cname(r.code)) : "");
    return `<div class="row ${r.is_me ? "mine" : ""}"><div class="pos">${r.pos}</div>${avatar(r.name, r.anon && !r.is_me)}<div><div class="name">${esc(r.name)}${you}</div><div class="meta">${r.code ? flag(r.code) + " " : ""}${where}</div></div><div class="stars">${val(r.value)}</div><div class="fill"><i style="width:${w}%"></i></div></div>`;
  }).join("")}</div>`;
  return html;
}

/* ---------------- Me tab ---------------- */
function rankCell(metric, scope, r, enabled) {
  if (!enabled) return `<span class="cell none" style="display:grid;place-items:center">n/a</span>`;
  const cls = !r ? "cell none" : r.pos === 1 ? "cell top" : "cell";
  const txt = r ? `#${r.pos}` : "–";
  return `<button class="${cls}" data-act="jump" data-metric="${metric}" data-scope="${scope}" aria-label="${metric} ${scope} rank ${txt}">${txt}</button>`;
}
function meHTML() {
  const m = S.me, rk = m.ranks || {};
  const badge = m.donor_no && m.donor_no <= 50 ? ` · Founding Donor #${m.donor_no}` : "";
  const reg = hasRegions(m.country);
  const rows = [
    [t("World"), "world", true, ""],
    [m.country ? esc(cname(m.country)) : t("My country"), "country", !!m.country, m.country ? "" : t("Pick a country")],
    [m.region ? esc(rname(m.region)) : t("My region"), "region", reg && !!m.region, reg && !m.region ? t("Pick a region") : ""],
  ];
  const matrix = `<table class="ranks"><tr><th></th><th>⭐ ${t("Stars")}</th><th>👥 ${t("Friends")}</th></tr>${rows.map(([label, scope, on, hint]) =>
    `<tr><td class="lab">${label}${hint ? `<small>${hint}</small>` : ""}</td><td>${rankCell("stars", scope, rk["stars_" + scope], on)}</td><td>${rankCell("friends", scope, rk["friends_" + scope], on)}</td></tr>`).join("")}</table>`;
  const canCountry = !m.locked;
  const canRegion = reg && (!m.locked || !m.region);
  const locRow = (label, small, html, act, btn) =>
    `<div class="setting"><div>${label}<small>${small}</small></div><div class="loc">${html}${act ? `<button class="btn ${btn === t("Choose") ? "gold" : ""}" style="flex:none;min-height:40px" data-act="${act}">${btn}</button>` : ""}</div></div>`;
  const countryLine = m.country
    ? locRow(t("Country"), m.locked ? t("Locked after your first donation") : t("You can change it until you donate"), `${flag(m.country)}<b>${esc(cname(m.country))}</b>${m.locked ? "🔒" : ""}`, canCountry ? "change-country" : "", t("Change"))
    : locRow(t("Country"), t("Choose it to join the rankings"), "", "open-donate", t("Choose"));
  const regionLine = reg
    ? locRow(t("Region"), m.region ? (m.locked ? t("Locked after your first donation") : t("You can change it until you donate")) : t("Optional. Adds you to your regional ranking"), m.region ? `<b>${esc(rname(m.region))}</b>${m.locked ? "🔒" : ""}` : "", canRegion ? "set-region" : "", m.region ? t("Change") : t("Choose"))
    : "";
  return `
  <div class="card">
    <div class="hello">${avatar(m.name, false)}<div><div class="t">${esc(m.name)}</div><div class="d">${esc(m.title)}${esc(badge)}</div></div></div>
    <div class="trio">
      <div><span class="num gold">${fmt(m.total)}</span><span class="l">${t("Your Stars")}</span></div>
      <div><span class="num">${fmt(m.invited)}</span><span class="l">${t("Friends invited")}</span></div>
      <div><span class="num">${m.pos ? "#" + m.pos : "–"}</span><span class="l">${t("World rank")}</span></div>
    </div>
  </div>
  <div class="card">
    <h2>${t("Your ranks")}</h2>
    <p>${t("Not in the world top? Look at your country and region. Tap a rank to see the list.")}</p>
    ${matrix}
  </div>
  ${badgesHTML()}
  <div class="card">
    <h2>${t("Invite friends")}</h2>
    <p>${m.invited ? t("{n} joined with your link. A friend counts once they pick a country.", { n: m.invited }) : t("Bring friends from your country. A friend counts once they pick a country.")}</p>
    <div class="btns"><button class="btn gold" data-act="share">${t("Share")}</button><button class="btn" data-act="copy">${t("Copy link")}</button></div>
  </div>
  <div class="card">
    <div class="setting"><div>${t("Hide my name")}<small>${t("Others see “Anonymous”. Your place still counts.")}</small></div>
      <button class="switch" role="switch" aria-checked="${m.anon}" aria-label="Hide my name" data-act="anon"></button></div>
    <div class="setting"><div>${t("Notifications")}<small>${t("Rank changes and weekly winners")}</small></div>
      <button class="switch" role="switch" aria-checked="${m.notify !== false}" aria-label="${t("Notifications")}" data-act="notify"></button></div>
    ${countryLine}${regionLine}
  </div>
  <div class="card">
    <h2>${t("How it works")}</h2>
    <ol class="how"><li>${t("Pick your country, and your region if it's listed.")}</li><li>${t("Donate Stars or invite friends.")}</li><li>${t("You climb the lists for the world, your country and your region.")}</li></ol>
  </div>`;
}

/* ---------------- header & render ---------------- */
const seg = (act, cur, opts, label) =>
  `<div class="seg" role="group" aria-label="${label}">${opts.map(([v, t]) => `<button data-act="${act}" data-v="${v}" aria-pressed="${cur === v}">${t}</button>`).join("")}</div>`;
function headerHTML() {
  if (S.tab === "me") return `<header><div><h1>${t("Me")}</h1></div>${langHTML()}</header>`;
  const cc = S.me.country, reg = hasRegions(cc);
  const places = S.tab === "p";
  const title = places ? t("Places") : t("People");
  const sub = places ? t("Countries and regions, ranked") : t("Who leads, near and far");
  let html = `<header><div><h1>${title}</h1><div class="sub">${sub}</div></div>${langHTML()}</header>`;
  html += `<div class="tools">${seg("metric", S.metric, [["stars", "⭐ " + t("Stars")], ["friends", "👥 " + t("Friends")]], t("Ranking by"))}${seg("period", S.period, [["all", t("All time")], ["week", t("Week")]], t("Period"))}</div>`;
  if (places) {
    if (reg) html += `<div class="tools scope">${seg("level", S.level, [["countries", t("Countries")], ["regions", esc(cname(cc))]], t("Level"))}</div>`;
  } else {
    const opts = [["world", t("World")]];
    if (cc) opts.push(["country", esc(cname(cc))]);
    if (reg && S.me.region) opts.push(["region", esc(rname(S.me.region))]);
    html += `<div class="tools scope">${seg("scope", S.scope, opts, t("Area"))}</div>`;
  }
  return html;
}
function render() {
  const app = $("#app");
  if (!S.me) return;
  normalizeScopes();
  const body = S.tab === "p" ? placesHTML() : S.tab === "pe" ? peopleHTML() : meHTML();
  app.innerHTML = headerHTML() + body;
  if (S.tab === "p" && S.board && S.board.kind === "places") S.entered = true;
  if (S.tab === "me" && !S.counted) { S.counted = true; countUp(document.querySelector(".trio .num.gold"), S.me.total); }
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
  const c = S.me.country;
  renderSheet();
}

/* ---------------- sheet: country → region → amount ---------------- */
function renderSheet() {
  const sh = S.sheet, el = $("#sheet");
  $("#backdrop").classList.toggle("open", sh.open);
  el.classList.toggle("open", sh.open);
  if (!sh.open) return;
  const keepSearch = document.activeElement && document.activeElement.id === "countrySearch";
  const place = S.me.region ? rname(S.me.region) : cname(S.me.country);
  let html = `<div class="grab"></div>`;
  if (sh.step === "country") {
    const q = sh.search.trim().toLowerCase();
    const list = S.countries.filter((c) => !q || c.name.toLowerCase().includes(q) || c.code.toLowerCase() === q);
    html += `<h2 id="sheetTitle">${t("Choose your country")}</h2><div class="lead">${t("Your Stars and friends count for it. It's locked after your first donation.")}</div>
      <input class="search" id="countrySearch" placeholder="${t("Search countries")}" autocomplete="off" value="${esc(sh.search)}" aria-label="Search countries">`;
    if (!q) html += `<div class="chips">${POPULAR.filter((c) => S.byCode[c]).map((c) => `<button class="chip" data-act="pick" data-code="${c}">${flag(c)} ${esc(S.byCode[c])}</button>`).join("")}</div>`;
    html += `<div class="picklist">${list.length ? list.map((c) => `<button class="pick" data-act="pick" data-code="${c.code}">${flag(c.code)} ${esc(c.name)}</button>`).join("") : `<div class="empty">${t("No country found.")}</div>`}</div>`;
  } else if (sh.step === "region") {
    const q = sh.search.trim().toLowerCase();
    const list = (S.regions[S.me.country] || []).filter((r) => !q || r.name.toLowerCase().includes(q));
    html += `<h2 id="sheetTitle">${t("Choose your region")}</h2><div class="lead">${t("Appear in the {c} regional ranking. It's locked after your first donation.", { c: esc(cname(S.me.country)) })}</div>
      <input class="search" id="countrySearch" placeholder="${t("Search regions")}" autocomplete="off" value="${esc(sh.search)}" aria-label="Search regions">
      <div class="picklist">${list.length ? list.map((r) => `<button class="pick" data-act="pick-region" data-key="${esc(r.key)}">${flag(S.me.country)} ${esc(r.name)}</button>`).join("") : `<div class="empty">${t("No region found.")}</div>`}</div>
      ${S.me.region ? "" : `<button class="btn" style="width:100%;margin-top:10px" data-act="skip-region">${t("Skip for now")}</button>`}`;
  } else if (sh.step === "intro") {
    const sl = [["🌍", "Pick your side", "Choose your country. Your Stars and friends will push it up the ranking."], ["🤝", "Invite and share", "Friends who join and pick a country raise your place. No donation needed."], ["🏆", "Win your corner", "You may not top the world, but you can lead your country or region."]];
    const i = S.introSlide, [em, h, p] = sl[i], last = i === sl.length - 1;
    html += `<div class="intro"><div class="big">${em}</div><h2 id="sheetTitle">${t(h)}</h2><div class="lead">${t(p)}</div>${last ? `<div class="trust">${t("Your Stars go to the bot owner. They buy you a place and a badge, nothing else.")}</div>` : ""}
      <div class="dots">${sl.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
      <button class="btn gold" style="width:100%;min-height:52px" data-act="intro-next">${last ? t("Let's go") : t("Next")}</button></div>`;
  } else if (sh.step === "done") {
    html += `<div class="done"><div class="big">🎉</div><h2 id="sheetTitle">${t("Thank you!")}</h2><div class="lead">${t("{n} ⭐ added to {p}. The ranking updates in a moment.", { n: fmt(sh.paid), p: flag(S.me.country) + " " + esc(place) })}</div><button class="btn gold" style="width:100%" data-act="challenge" data-text="${esc(t("{x} leads the World Rich List! Come and join the race.", { x: place }))}">📣 ${t("Tell your friends")}</button><button class="btn" style="width:100%;margin-top:8px" data-act="close-sheet">${t("Back to ranking")}</button></div>`;
  } else {
    const preset = S.cfg.presets.includes(sh.amount) && !sh.custom;
    html += `<h2 id="sheetTitle">${t("Donate for {p}", { p: flag(S.me.country) + " " + esc(place) })}</h2><div class="lead">${t("Choose how many Stars to send.")}</div>
      ${S.cfg.min <= 1 ? `<button class="trial" data-act="amount" data-v="1" aria-pressed="${sh.amount === 1 && !sh.custom}">⭐<span>${t("Try 1 ⭐")}<small>${t("A tiny first step. It still counts.")}</small></span></button>` : ""}
      <div class="amounts">${S.cfg.presets.map((a) => `<button data-act="amount" data-v="${a}" aria-pressed="${preset && sh.amount === a}">${fmt(a)} ⭐</button>`).join("")}</div>
      <div class="custom"><input class="search" id="customAmount" inputmode="numeric" pattern="[0-9]*" placeholder="${t("Other amount")} (${S.cfg.min}–${fmt(S.cfg.max)})" value="${esc(sh.custom)}" aria-label="Custom amount"></div>
      <div class="setting"><div>${t("Hide my name")}<small>${t("Others see “Anonymous”")}</small></div><button class="switch" role="switch" aria-checked="${S.me.anon}" aria-label="Hide my name" data-act="anon"></button></div>
      <div class="err" id="sheetErr">${esc(sh.error)}</div>
      <button class="btn gold" style="width:100%;min-height:54px;font-size:16px" data-act="pay" ${sh.busy ? "disabled" : ""}>${sh.busy ? t("Opening payment…") : t("Donate {n} ⭐", { n: fmt(effectiveAmount()) })}</button>`;
  }
  el.innerHTML = html;
  if (keepSearch) { const i = $("#countrySearch"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
}
const effectiveAmount = () => {
  const c = parseInt(S.sheet.custom, 10);
  return S.sheet.custom && Number.isFinite(c) ? c : S.sheet.amount;
};
function openSheet(step, after) {
  const m = S.me;
  let st = step;
  if (!st) {
    if (!m.country) st = "country";
    else if (hasRegions(m.country) && !m.region && !S.regionAsked) { st = "region"; S.regionAsked = true; }
    else st = "amount";
  }
  S.sheet = { ...S.sheet, open: true, error: "", busy: false, search: "", custom: "", step: st, after: after || "amount" };
  renderSheet(); haptic("light");
}
function closeSheet() { S.sheet.open = false; renderSheet(); }
function afterPick() {
  if (S.sheet.after === "close") { closeSheet(); if (S.tab !== "me") loadBoard(); else render(); }
  else { S.sheet.step = "amount"; S.sheet.search = ""; render(); }
}

async function pay() {
  const sh = S.sheet, amount = effectiveAmount();
  if (!Number.isInteger(amount) || amount < S.cfg.min || amount > S.cfg.max) {
    sh.error = t("Enter an amount from {a} to {b} Stars.", { a: S.cfg.min, b: fmt(S.cfg.max) }); return renderSheet();
  }
  sh.busy = true; sh.error = ""; renderSheet();
  try {
    const { link } = await api("/api/invoice", { method: "POST", body: { amount } });
    tg.openInvoice(link, (status) => {
      sh.busy = false;
      if (status === "paid") {
        sh.step = "done"; sh.paid = amount; renderSheet(); confetti();
        try { tg.HapticFeedback.notificationOccurred("success"); } catch (_) {}
        setTimeout(refreshAll, 1200); setTimeout(refreshAll, 4000);
      } else if (status === "failed") { sh.error = t("The payment didn't go through. Try again."); renderSheet(); }
      else renderSheet();
    });
  } catch (e) { sh.busy = false; sh.error = e.message; renderSheet(); }
}

function confetti() {
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#FFC53D", "#62E0B4", "#FF6B8A", "#9AA0D6", "#F2F0FF"];
  for (let i = 0; i < 46; i++) {
    const d = document.createElement("i"); d.className = "confetti";
    d.style.left = Math.random() * 100 + "vw"; d.style.background = colors[i % colors.length];
    d.style.setProperty("--dx", (Math.random() * 120 - 60) + "px"); d.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
    d.style.animationDelay = Math.random() * 0.4 + "s"; document.body.appendChild(d);
    setTimeout(() => d.remove(), 2600);
  }
}
function countUp(el, to) {
  if (!el || to < 2 || (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
  const t0 = performance.now(), dur = 700;
  const step = (now) => { const p = Math.min(1, (now - t0) / dur); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ---------------- events ---------------- */
function reload() { S.board = null; haptic(); loadBoard(); }
document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-act],[data-tab]");
  if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; haptic(); window.scrollTo(0, 0); S.board = null; return S.tab === "me" ? render() : loadBoard(); }
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case "open-donate": openSheet(); break;
    case "change-country": openSheet("country", "close"); break;
    case "set-region": openSheet("region", "close"); break;
    case "close-sheet": closeSheet(); break;
    case "intro-next":
      if (S.introSlide < 2) { S.introSlide++; renderSheet(); }
      else { try { localStorage.setItem("wrl_seen", "1"); } catch (_) {} closeSheet(); if (!S.me.country) openSheet(); }
      break;
    case "notify":
      try { const r = await api("/api/notify", { method: "POST" }); S.me = r.me; haptic(); render(); } catch (err) { toast(err.message); }
      break;
    case "lang": setLang(t.dataset.v); haptic(); break;
    case "metric": S.metric = v; reload(); break;
    case "period": S.period = v; reload(); break;
    case "level": S.level = v; reload(); break;
    case "scope": S.scope = v; reload(); break;
    case "jump": S.tab = "pe"; S.metric = t.dataset.metric; S.scope = t.dataset.scope; S.period = "all"; window.scrollTo(0, 0); reload(); break;
    case "amount": S.sheet.amount = parseInt(v, 10); S.sheet.custom = ""; S.sheet.error = ""; haptic(); renderSheet(); break;
    case "pick":
      try {
        const r = await api("/api/country", { method: "POST", body: { code: t.dataset.code } });
        S.me = r.me; haptic("medium");
        if (hasRegions(S.me.country)) { S.regionAsked = true; S.sheet.step = "region"; S.sheet.search = ""; render(); }
        else afterPick();
      } catch (err) { toast(err.message); }
      break;
    case "pick-region":
      try {
        const r = await api("/api/region", { method: "POST", body: { key: t.dataset.key } });
        S.me = r.me; haptic("medium"); afterPick();
      } catch (err) { toast(err.message); }
      break;
    case "skip-region": afterPick(); break;
    case "anon":
      try { const r = await api("/api/anon", { method: "POST" }); S.me = r.me; haptic(); render(); }
      catch (err) { toast(err.message); }
      break;
    case "pay": pay(); break;
    case "challenge": {
      const url = `https://t.me/share/url?url=${encodeURIComponent(S.me.link)}&text=${encodeURIComponent(t.dataset.text || "")}`;
      tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, "_blank"); break; }
    case "share": {
      const url = `https://t.me/share/url?url=${encodeURIComponent(S.me.link)}&text=${encodeURIComponent(shareText())}`;
      tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, "_blank"); break; }
    case "copy":
      try { await navigator.clipboard.writeText(S.me.link); toast(t("Link copied")); }
      catch (_) { toast("Copy this link: " + S.me.link); }
      break;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "countrySearch") { S.sheet.search = e.target.value; renderSheet(); }
  if (e.target.id === "customAmount") {
    S.sheet.custom = e.target.value.replace(/\D/g, "").slice(0, 5); e.target.value = S.sheet.custom; S.sheet.error = "";
    const btn = document.querySelector('[data-act="pay"]'); if (btn) btn.textContent = t("Donate {n} ⭐", { n: fmt(effectiveAmount() || 0) });
    document.querySelectorAll(".amounts button").forEach((b) => b.setAttribute("aria-pressed", "false"));
  }
});

/* ---------------- demo data (only with ?demo=1 outside Telegram) ---------------- */
const DEMO_STATE = { region: "UZ-SAMARKAND", country: "UZ" };
function demoApi(path, opts) {
  const names = { UZ:"Uzbekistan", KZ:"Kazakhstan", TR:"Türkiye", KG:"Kyrgyzstan", RU:"Russia", US:"United States", DE:"Germany", IN:"India", BR:"Brazil", JP:"Japan", TJ:"Tajikistan", AZ:"Azerbaijan" };
  const regs = { UZ: [["UZ-ANDIJAN","Andijan"],["UZ-BUKHARA","Bukhara"],["UZ-FERGANA","Fergana"],["UZ-SAMARKAND","Samarkand"],["UZ-TASHKENT-CITY","Tashkent City"]] };
  const me = () => ({ name: "Demo User", title: "🐬 Dolphin", total: 120, locked: true, donor_no: 7, anon: false, country: DEMO_STATE.country, region: DEMO_STATE.region, pos: 14, week_stars: 60, week_pos: 3, invited: 2,
    ranks: { country: "UZ", region: "UZ-SAMARKAND", stars_world: { pos: 14, value: 120 }, stars_country: { pos: 3, value: 120 }, stars_region: { pos: 1, value: 120 }, friends_world: null, friends_country: { pos: 2, value: 2 }, friends_region: { pos: 1, value: 2 } },
    link: "https://t.me/WorldRichListBot?start=ref_1" });
  if (path.startsWith("/api/bootstrap")) return Promise.resolve({ me: me(), countries: Object.entries(names).map(([code, name]) => ({ code, name })), regions: Object.fromEntries(Object.entries(regs).map(([c, l]) => [c, l.map(([key, name]) => ({ key, name }))])), config: { presets: [10, 50, 100, 500, 1000], min: 1, max: 10000, sample: { show: false, stars: 100 } } });
  if (path.startsWith("/api/country")) { DEMO_STATE.country = JSON.parse(opts.body ? JSON.stringify(opts.body) : "{}").code; DEMO_STATE.region = null; return Promise.resolve({ me: me() }); }
  if (path.startsWith("/api/region")) { DEMO_STATE.region = opts.body.key; return Promise.resolve({ me: me() }); }
  if (path.startsWith("/api/notify") || path.startsWith("/api/ref")) return Promise.resolve({ me: me() });
  if (path.startsWith("/api/pulse")) return Promise.resolve({ battle: { resets_in: 301000, now: [{ key: "KZ", value: 320, members: 5 }, { key: "UZ", value: 280, members: 4 }, { key: "TR", value: 90, members: 2 }], last: [{ key: "UZ", value: 900, members: 11 }], last_regions: [{ key: "UZ-SAMARKAND", value: 400, members: 4 }] }, feed: [{ name: "@aziz", amount: 50, code: "UZ", region: "UZ-TASHKENT-CITY", ago: 120 }, { name: "Anonymous", amount: 100, code: "KZ", region: null, ago: 1900 }, { name: "Demo User", is_me: true, amount: 10, code: "UZ", region: "UZ-SAMARKAND", ago: 9000 }] });
  if (path.startsWith("/api/board")) {
    const q = new URLSearchParams(path.split("?")[1]), f = q.get("metric") === "friends" ? 0.05 : 1;
    const v = (n) => Math.max(1, Math.round(n * f));
    if (q.get("kind") === "places") {
      if (q.get("scope") === "regions") return Promise.resolve({ kind: "places", scope: "regions", country: "UZ", mine: { key: "UZ-SAMARKAND", pos: 2, value: v(900) }, rows: [["UZ-TASHKENT-CITY",1300,18],["UZ-SAMARKAND",900,11],["UZ-FERGANA",410,6],["UZ-ANDIJAN",120,3]].map(([key, value, members], i) => ({ pos: i + 1, key, value: v(value), members })) });
      return Promise.resolve({ kind: "places", scope: "countries", country: null, mine: { key: "UZ", pos: 2, value: v(1840) }, rows: [["KZ",2290,41],["UZ",1840,37],["TR",1210,22],["RU",980,18],["KG",640,12],["US",420,9],["DE",300,6],["AZ",150,4]].map(([key, value, members], i) => ({ pos: i + 1, key, value: v(value), members })) });
    }
    const scope = q.get("scope");
    const all = [["@aziz",500,"UZ","UZ-TASHKENT-CITY",0],["Anonymous",420,"KZ","KZ-ALMATY",1],["Malika",300,"UZ","UZ-SAMARKAND",0],["Demo User",120,"UZ","UZ-SAMARKAND",0,1]];
    const list = scope === "world" ? all : scope === "country" ? all.filter((r) => r[2] === "UZ") : all.filter((r) => r[3] === "UZ-SAMARKAND");
    const rows = list.map(([name, value, code, region, anon, isMe], i) => ({ pos: i + 1, name, value: v(value), code, region, anon: !!anon, is_me: !!isMe }));
    const mineRow = rows.find((r) => r.is_me);
    return Promise.resolve({ kind: "people", scope, geo: null, rows, mine: mineRow ? { pos: mineRow.pos, value: mineRow.value } : null });
  }
  return Promise.reject(new Error("This is a demo. Open the app from Telegram to donate."));
}

/* ---------------- boot ---------------- */
async function boot() {
  LANG = detectLang(); document.documentElement.lang = LANG; applyStatic();
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#12163A"); tg.setBackgroundColor("#12163A"); tg.setBottomBarColor && tg.setBottomBarColor("#12163A"); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (_) {} }
  if (!INIT && !DEMO) {
    $("#app").innerHTML = `<div class="gate"><div><b>${t("Open this app from Telegram")}</b>${t("Find @WorldRichListBot and tap “Open App”.")}</div></div>`; return;
  }
  $("#app").innerHTML = `<div class="skel" style="margin-top:80px"></div><div class="skel"></div><div class="skel"></div>`;
  try {
    const sp = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || new URLSearchParams(location.search).get("ref") || "";
    if (/^ref_\d+$/.test(sp) && !DEMO) { try { await api("/api/ref", { method: "POST", body: { ref: sp } }); } catch (_) {} }
    const b = await api("/api/bootstrap");
    S.me = b.me; S.cfg = b.config; S.countries = b.countries; S.regions = b.regions || {};
    S.countries.forEach((c) => { S.byCode[c.code] = c.name; });
    Object.values(S.regions).forEach((l) => l.forEach((r) => { S.regName[r.key] = r.name; }));
    $("#dock").hidden = false;
    const p = new URLSearchParams(location.search);
    if (DEMO) { // preview helpers: ?demo=1&tab=p|pe|me&metric=friends&level=regions&scope=country&sheet=country|region|amount&nocountry=1
      S.tab = p.get("tab") || "p"; S.metric = p.get("metric") || "stars"; S.level = p.get("level") || "countries"; S.scope = p.get("scope") || "world";
      if (p.get("nocountry")) S.me.country = null;
    }
    S.tab === "me" ? render() : await loadBoard();
    if (DEMO && p.get("sheet")) { openSheet(p.get("sheet")); }
    else { let seen = false; try { seen = !!localStorage.getItem("wrl_seen"); } catch (_) {} if (!seen && !S.me.country && !S.me.total) openSheet("intro"); }
  } catch (e) {
    $("#app").innerHTML = `<div class="gate"><div><b>${t("Couldn't load")}</b>${esc(e.message)}</div></div>`;
  }
}
boot();
})();
